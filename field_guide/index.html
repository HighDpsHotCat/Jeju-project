<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf7ef" />
    <title>동물 도감 · 제주 탐험</title>
    <link rel="stylesheet" href="/field.css" />
    <script type="module" src="/guide.js"></script>
  </head>
  <body>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="/?view=home"
          ><span class="brand-icon" data-icon="sprout"></span>제주 탐험</a
        >
        <nav aria-label="주 메뉴">
          <a class="current" href="/" aria-current="page"
            ><i data-icon="book"></i>도감</a
          ><a href="/map"><i data-icon="map"></i>관찰 지도</a
          ><a class="source-link" href="/ecology">생태자연도</a>
        </nav>
      </div>
    </header>
    <main class="journal">
      <section class="home paper" id="home" aria-labelledby="home-title">
        <div class="panel-head">
          <h2 id="home-title" class="brush">나의 탐험</h2>
          <button id="settings" class="icon-name">
            <i data-icon="settings"></i>설정
          </button>
        </div>
        <h3 class="question">오늘은 어떤 동물을 만날까요?</h3>
        <div class="hero-art">
          <img
            src="/art/explorer.jpg"
            alt="한라산 돌담 앞에서 쌍안경을 든 탐험가"
          />
        </div>
        <button class="character" id="character">나의 캐릭터</button>
        <button class="my-count" id="to-guide">
          <span class="paw-circle" data-icon="paw"></span
          ><b id="home-count-label">발견한 동물</b
          ><strong id="home-count">0종</strong>
        </button>
        <a class="map-shortcut" href="/map"
          ><i data-icon="map"></i> 제주 관찰 지도 열기
          <span aria-hidden="true">→</span></a
        >
      </section>
      <section class="guide paper" id="guide" aria-labelledby="guide-title">
        <div class="panel-head">
          <div class="title-line">
            <a class="back" aria-label="마당으로 돌아가기" href="/?view=home"
              >←</a
            >
            <h1 id="guide-title">동물 도감</h1>
          </div>
          <select id="region" aria-label="도감 지역 선택">
            <option value="jeju">제주 목격 생물</option>
            <option value="national">전국 도감</option>
          </select>
        </div>
        <form class="search" role="search">
          <i data-icon="search"></i
          ><input
            id="query"
            type="search"
            autocomplete="off"
            aria-label="동물 이름, 학명 또는 종 ID 검색"
            placeholder="동물 이름 검색"
          />
        </form>
        <div class="tabs" id="groups" role="group" aria-label="동물 분류">
          <button aria-pressed="true" data-group="">전체</button
          ><button aria-pressed="false" data-group="Mammalia">포유류</button
          ><button aria-pressed="false" data-group="Aves">조류</button
          ><button aria-pressed="false" data-group="Insecta">곤충</button>
        </div>
        <div class="discovery">
          <i data-icon="paw"></i><span id="count-label">발견한 동물</span
          ><strong id="guide-count">0종</strong>
        </div>
        <div class="columns" aria-hidden="true">
          <span>사진</span><span>이름 · 설명</span><span>등록 여부</span>
        </div>
        <div id="animals" class="animals" aria-label="동물 목록"></div>
        <p class="status" id="status" role="status">도감을 불러오는 중…</p>
        <nav class="pager" aria-label="결과 페이지">
          <button id="prev" disabled>← 이전</button
          ><button id="next" disabled>다음 →</button>
        </nav>
      </section>
    </main>
    <nav class="dock" aria-label="탐험 메뉴">
      <a href="/" id="guide-nav"><i data-icon="book"></i>도감</a
      ><button id="camera"><i data-icon="camera"></i>카메라</button
      ><a href="/?view=home" id="home-nav"><i data-icon="sprout"></i>마당</a>
    </nav>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-heading">
        <h2 id="sheet-title"></h2>
        <button id="close" aria-label="닫기">×</button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <input
      id="capture"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
  </body>
</html>
