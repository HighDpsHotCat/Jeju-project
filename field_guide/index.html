<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf7ef" />
    <title>동물 도감 · 제주 탐험</title>
    <link rel="stylesheet" href="/field.css" />
    <script type="module" src="/guide.js"></script>
  </head>
  <body>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="/"
          ><span class="brand-icon" data-icon="sprout"></span>제주 탐험</a
        >
        <nav aria-label="주 메뉴">
          <a id="mast-guide" href="/?view=guide"
            ><i data-icon="book"></i>도감</a
          ><a href="/map"><i data-icon="map"></i>관찰 지도</a
          ><a class="source-link" href="/ecology">생태자연도</a>
        </nav>
      </div>
    </header>
    <main class="journal">
      <section class="home paper trail" id="main" aria-labelledby="main-title">
        <div class="panel-head"><h1 class="brush" id="main-title">나의 탐험</h1><button class="icon-name settings"><i data-icon="settings"></i>설정</button></div>
        <p class="greeting">오늘은 어떤 동물을 만날까요?</p>
        <div class="main-actions"><a class="action" href="/?view=guide"><i data-icon="paw"></i><span id="home-count-label">발견한 동물</span> <b id="home-count">0종</b></a>
        <a class="action" href="/map"><i data-icon="map"></i>지도</a></div>
      </section>
      <section class="home paper" id="yard" aria-labelledby="yard-title" hidden>
        <div class="panel-head"><h1 class="brush" id="yard-title">나의 마당</h1><button class="icon-name settings"><i data-icon="settings"></i>설정</button></div>
        <h2 class="greeting">오늘은 어떤 동물을 만날까요?</h2>
        <div class="hero-art"><img src="/art/explorer.jpg" alt="한라산 돌담 앞의 탐험가"></div>
        <a class="character action" href="/yard">마당 입장</a>
        <p><a class="action" href="/?view=guide&amp;from=yard"><i data-icon="paw"></i>발견한 동물 <b id="yard-count">0종</b></a></p>
      </section>
      <section hidden class="guide paper" id="guide" aria-labelledby="guide-title">
        <div class="panel-head">
          <div class="title-line">
            <a class="back" id="guide-back" aria-label="메인으로 돌아가기" href="/"
              >←</a
            >
            <h1 id="guide-title">동물 도감</h1>
          </div>
          <select id="region" aria-label="도감 지역 선택">
            <option value="jeju">제주 목격 생물</option>
            <option value="national">전국 도감</option>
          </select>
        </div>
        <form class="search" role="search">
          <i data-icon="search"></i
          ><input
            id="query"
            type="search"
            autocomplete="off"
            aria-label="동물 이름, 학명 또는 종 ID 검색"
            placeholder="동물 이름 검색"
          />
        </form>
        <div class="tabs" id="groups" role="group" aria-label="동물 분류">
          <button aria-pressed="true" data-group="">전체</button
          ><button aria-pressed="false" data-group="Mammalia">포유류</button
          ><button aria-pressed="false" data-group="Aves">조류</button
          ><button aria-pressed="false" data-group="Insecta">곤충</button>
        </div>
        <div class="discovery">
          <i data-icon="paw"></i><span id="count-label">발견한 동물</span
          ><strong id="guide-count">0종</strong>
        </div>
        <div class="columns" aria-hidden="true">
          <span>사진</span><span>이름 · 설명</span><span>등록 여부</span>
        </div>
        <div id="animals" class="animals" aria-label="동물 목록"></div>
        <p class="status" id="status" role="status">도감을 불러오는 중…</p>
        <nav class="pager" aria-label="결과 페이지">
          <button id="prev" disabled>← 이전</button
          ><button id="next" disabled>다음 →</button>
        </nav>
      </section>
    </main>
    <nav class="dock" aria-label="탐험 메뉴">
      <a href="/?view=guide" id="guide-nav"><i data-icon="book"></i>도감</a>
      <a href="/" id="main-nav"><i data-icon="house"></i>메인</a>
      <a href="/?view=yard" id="yard-nav"><i data-icon="sprout"></i>마당</a>
      <button id="camera"><i data-icon="camera"></i>카메라</button>
    </nav>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-heading">
        <h2 id="sheet-title"></h2>
        <button id="close" aria-label="닫기">×</button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <input
      id="capture"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
  </body>
</html>
