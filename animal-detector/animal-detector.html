const source='https://huggingface.co/Xenova/dinov2-small/resolve/c2bb04a51fab207c420665f1946016107bffc701/onnx/model.onnx';
const clipSource='https://huggingface.co/Xenova/clip-vit-base-patch16/resolve/342fdf2f67aded64d138ff074745fb4a5d2bba5f/onnx/vision_model_quantized.onnx';
let session;
async function prepare(){
  if(session)return session;
  const ort=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.wasm.min.mjs');
  ort.env.wasm.numThreads=1;
  ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
  const model=await ort.InferenceSession.create(source,{executionProviders:['wasm']});
  const clip=await ort.InferenceSession.create(clipSource,{executionProviders:['wasm']});
  session={ort,model,clip};
  return session;
}
function probabilities(head,features,offset){
  let norm=0;
  for(let j=0;j<stride;j++)norm+=features[offset+j]**2;
  norm=Math.sqrt(norm)||1;
  const logits=head.w.map((w,k)=>{
    let sum=0;
    for(let j=0;j<stride;j++)sum+=w[j]*features[offset+j];
    return sum/norm+head.b[k];
  });
  const max=Math.max(...logits), exp=logits.map(x=>Math.exp(x-max)), total=exp.reduce((a,b)=>a+b,0);
  return exp.map(x=>x/total);
}
function clusters(scores,label,threshold){
  const active=scores.map(p=>p[label]>=threshold && p.indexOf(Math.max(...p))===label);
  const regions=[];
  for(let i=0;i<active.length;i++){
    if(!active[i])continue;
    active[i]=false;
    const members=[i];
    for(let h=0;h<members.length;h++){
      const at=members[h],x=at%grid,y=Math.floor(at/grid);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;
        if(nx<0||nx>=grid||ny<0||ny>=grid)continue;
        const n=ny*grid+nx;
        if(active[n]){active[n]=false;members.push(n);}
      }
    }
    if(members.length<3)continue;
    const xs=members.map(m=>m%grid),ys=members.map(m=>Math.floor(m/grid));
    regions.push({label,area:members.length,box:[Math.min(...xs),Math.min(...ys),Math.max(...xs)+1,Math.max(...ys)+1]});
  }
  return regions.sort((a,b)=>b.area-a.area);
}
async function infer(image,region){
  const {ort,model,clip}=await prepare();
  const sample=document.createElement('canvas');sample.width=side;sample.height=side;
  const c=sample.getContext('2d',{willReadFrequently:true});c.imageSmoothingQuality='high';
  c.drawImage(image,...region,0,0,side,side);
  const rgba=c.getImageData(0,0,side,side).data, plane=side*side, data=new Float32Array(3*plane);
  const mean=[.485,.456,.406],sd=[.229,.224,.225];
  for(let k=0;k<3;k++)for(let i=0;i<plane;i++)data[k*plane+i]=(rgba[i*4+k]/255-mean[k])/sd[k];
  const tensor=new ort.Tensor('float32',data,[1,3,side,side]);
  const out=await model.run({pixel_values:tensor});
  const tokens=out.last_hidden_state.data;
  const clipInput=new Float32Array(data.length),cm=[.48145466,.4578275,.40821073],cs=[.26862954,.26130258,.27577711];
  for(let k=0;k<3;k++)for(let i=0;i<plane;i++)clipInput[k*plane+i]=(rgba[i*4+k]/255-cm[k])/cs[k];
  const ct=new ort.Tensor('float32',clipInput,[1,3,side,side]);
  const co=await clip.run({pixel_values:ct});
  const features=[];
  for(const part of [tokens.subarray(0,stride),co.image_embeds.data]){
    const norm=Math.sqrt(part.reduce((a,b)=>a+b*b,0))||1;
    for(const value of part)features.push(value/norm);
  }
  const fine=learned.fine;
  const logits=fine.w.map((w,i)=>w.reduce((s,v,j)=>s+v*features[j],fine.b[i]));
  const maxLogit=Math.max(...logits),exp=logits.map(v=>Math.exp(v-maxLogit)),total=exp.reduce((a,b)=>a+b,0);
  const global=new Array(8).fill(0);
  exp.forEach((v,i)=>global[fine.groups[i]]+=v/total);
  for(const value of Object.values(co))value.dispose();ct.dispose();
  const patches=Array.from({length:grid*grid},(_,i)=>probabilities(learned.patch,tokens,(i+1)*stride));
  for(const value of Object.values(out))value.dispose();tensor.dispose();
  return {global,patches};
}
async function detect(image){
  const {global,patches}=await infer(image,[0,0,image.width,image.height]);
  const main=global.indexOf(Math.max(...global));
  const hits=[];
  if(main<names.length && global[main]>=learned.fine.threshold){
    const regions=clusters(patches,main,.26);
    if(regions.length){
      const minimum=Math.max(3,regions[0].area*.19);
      hits.push(...regions.filter(r=>r.area>=minimum));
    }else hits.push({label:main,box:null});
  }
  // Check a separate crop before showing a second species in a mixed photo.
  for(let k=0;k<names.length;k++){
    if(k===main)continue;
    const candidate=clusters(patches,k,.65)[0];
    if(!candidate||candidate.area<9)continue;
    const [left,top,right,bottom]=candidate.box;
    const x=Math.max(0,left-1),y=Math.max(0,top-1);
    const crop=[x*image.width/grid,y*image.height/grid,(Math.min(grid,right+1)-x)*image.width/grid,(Math.min(grid,bottom+1)-y)*image.height/grid];
    const result=await infer(image,crop);
    if(result.global[k]>.85)hits.push(candidate);
  }
  return hits;
}
function draw(hit){
  if(!hit.box)return;
  const [left,top,right,bottom]=hit.box;
  const x=left*view.width/grid,y=top*view.height/grid;
  const size=Math.max(15,Math.round(view.width/45));ctx.font='bold '+size+'px sans-serif';
  ctx.lineWidth=Math.max(2,size/7);ctx.strokeStyle='#51ffc1';ctx.strokeRect(x,y,(right-left)*view.width/grid,(bottom-top)*view.height/grid);
  const name=names[hit.label],w=ctx.measureText(name).width+12;
  const tx=Math.max(0,Math.min(view.width-w,x)),ty=Math.max(0,y-size-8);
  ctx.fillStyle='#073d30';ctx.fillRect(tx,ty,w,size+8);ctx.fillStyle='#fff';ctx.fillText(name,tx+6,ty+size+1);
}
input.onchange=async()=>{
  const file=input.files[0];if(!file)return;
  input.disabled=true;view.hidden=true;status.textContent='사진을 여는 중…';
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();image.src=url;await image.decode();
    const scale=Math.min(1,1400/Math.max(image.width,image.height));
    view.width=Math.max(1,Math.round(image.width*scale));view.height=Math.max(1,Math.round(image.height*scale));
    ctx.drawImage(image,0,0,view.width,view.height);view.hidden=false;
    status.textContent='모델을 준비하는 중…';await prepare();
    status.textContent='사진을 분석하는 중…';
    const hits=await detect(view);hits.forEach(draw);
    const labels=[...new Set(hits.map(h=>names[h.label]))];
    status.textContent=labels.length?'탐지 결과 · '+labels.join(', '):'판별 가능한 대상 동물을 찾지 못했습니다.';
  }catch(error){console.error(error);status.textContent='분석에 실패했습니다. 인터넷 연결과 사진 형식(JPEG·PNG)을 확인해 주세요.';}
  finally{URL.revokeObjectURL(url);input.value='';input.disabled=false;}
};

</script></html>
